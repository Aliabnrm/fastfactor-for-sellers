services:
  postgres:
    image: postgres:17
    container_name: fastfactor-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastfactor_db

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastfactor_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend

    container_name: fastfactor-backend

    restart: unless-stopped

    ports:
      - "4000:4000"

    env_file:
      - ./backend/.env.docker

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    command: pnpm dev

  frontend:   
    build:
      context: ./frontend

    container_name: fastfactor-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    env_file:
      - ./frontend/.env.docker

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: pnpm dev --host

volumes:
  postgres-data: